<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jogo do número secreto</title>
</head>
<body>
    <main class="container">
        <section class="container__conteudo" aria-labelledby="titulo">
            <div class="container__informacoes">
                <div class="container__texto">
                    <h1 id="titulo">Adivinhe o <span class="container__texto-azul">número secreto</span></h1>
                    <p class="texto__paragrafo" id="mensagem" aria-live="polite">Escolha um número entre 1 e 10.</p>
                </div>
                <form id="guess-form">
                    <label class="visually-hidden" for="guess">Seu palpite</label>
                    <input id="guess" name="guess" type="number" min="1" max="10" step="1"
                        class="container__input" inputmode="numeric" required autocomplete="off">
                    <div class="container__botoes">
                        <button type="submit" class="container__botao">Chutar</button>
                        <button type="button" id="reiniciar" class="container__botao" disabled>Novo jogo</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
